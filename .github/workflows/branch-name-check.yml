name: Branch Name Check

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Checking branch name: $BRANCH"

          # 보호 브랜치는 검사하지 않음
          if [[ "$BRANCH" =~ ^(main|master|develop|staging)$ ]]; then
            echo "✓ Protected branch - skipping validation"
            exit 0
          fi

          # 허용된 타입
          VALID_TYPES="feature|fix|hotfix|release|refactor|docs|test|chore|style|copilot|claude"

          # 패턴: type/description 또는 type/domain/description
          # 허용: 소문자, 숫자, 특수문자 (단, 대문자/언더스코어/공백/슬래시 제외)
          PATTERN="^(${VALID_TYPES})/[a-z0-9][^A-Z_[:space:]/]*(/[a-z0-9][^A-Z_[:space:]/]*)?$"

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Invalid branch name: $BRANCH"
            echo ""
            echo "Branch name must follow the pattern: <type>/<description> or <type>/<domain>/<description>"
            echo ""
            echo "Valid types: feature, fix, hotfix, release, refactor, docs, test, chore, style, copilot, claude"
            echo ""
            echo "Description rules:"
            echo "  - Must start with a lowercase letter or number"
            echo "  - Can contain lowercase letters, numbers, and special characters"
            echo "  - Cannot contain: uppercase letters, underscores, spaces, or slashes"
            echo ""
            echo "Examples:"
            echo "  ✓ feature/user-authentication"
            echo "  ✓ release/1.0.0"
            echo "  ✓ fix/404-error"
            echo "  ✓ feature/frontend/user-authentication"
            echo "  ✗ Feature/Frontend/User-auth (uppercase not allowed)"
            echo "  ✗ feature/add_function (underscore not allowed)"
            echo "  ✗ feature/a/b/c (max 3 levels)"
            echo "  ✗ my-feature (missing type)"
            exit 1
          fi

          echo "✓ Branch name is valid"
